name: Build TomeBox

on:
  push:
    branches: [ "main", "master", "linted" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build Windows Executable
      if: runner.os == 'Windows'
      run: pyinstaller --name TomeBox --windowed --add-data "ui:ui" --add-data "server/mobile_ui.html:server" --add-data "server/static:server/static" --add-data "tomebox-splash.png:." main.py
    
    - name: Download Static FFmpeg, FFprobe & FFplay (macOS)
      if: runner.os == 'macOS'
      env:
        # evermeet.cx removed its "getrelease" redirect API; download pinned versioned files instead.
        # Available versions: https://evermeet.cx/ffmpeg/info/ffmpeg/release
        FFMPEG_VERSION: "9.1"
      run: |
        set -euo pipefail
        mkdir -p bin
        for tool in ffmpeg ffprobe ffplay; do
          url="https://evermeet.cx/ffmpeg/${tool}-${FFMPEG_VERSION}.zip"
          echo "Downloading ${url}"
          # -f: fail on HTTP errors instead of saving the error page as the zip
          curl -fsSL --retry 3 --retry-delay 5 "${url}" -o "${tool}.zip"
          unzip -tq "${tool}.zip"           # integrity check before extracting
          unzip -o "${tool}.zip" -d bin/
          rm "${tool}.zip"
          chmod +x "bin/${tool}"
          file "bin/${tool}"                # logs the architecture of each binary
        done
          
    - name: Build Mac Application
      if: runner.os == 'macOS'
      run: pyinstaller --name TomeBox --windowed --add-data "ui:ui" --add-data "server/mobile_ui.html:server" --add-data "server/desktop_ui.html:server" --add-data "server/static:server/static" --add-data "tomebox-splash.png:." --add-binary "bin/ffmpeg:bin" --add-binary "bin/ffprobe:bin" --add-binary "bin/ffplay:bin" main.py
    - name: Zip Mac App
      if: runner.os == 'macOS'
      run: |
        cd dist
        zip -r TomeBox-macOS.zip TomeBox.app

    - name: Upload Windows Artifact
      if: runner.os == 'Windows'
      uses: actions/upload-artifact@v4
      with:
        name: TomeBox-Windows
        path: dist/TomeBox.exe

    - name: Upload Mac Artifact
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: TomeBox-macOS
        path: dist/TomeBox-macOS.zip